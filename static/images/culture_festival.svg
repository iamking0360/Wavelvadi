<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#FEF3C7"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="4"/>
  <!-- Temple Silhouette -->
  <path d="M250,380 L250,220 L400,120 L550,220 L550,380 Z" fill="#78350F" opacity="0.15"/>
  <polygon points="400,60 370,120 430,120" fill="#EA580C"/>
  <path d="M400,60 L460,75 L400,90 Z" fill="#EA580C"/>
  <line x1="400" y1="40" x2="400" y2="90" stroke="#78350F" stroke-width="4"/>

  <!-- Dhol drum illustration -->
  <g transform="translate(400, 320)">
    <ellipse cx="0" cy="0" rx="90" ry="50" fill="#B45309" stroke="#78350F" stroke-width="6"/>
    <ellipse cx="-70" cy="0" rx="20" ry="50" fill="#D97706" stroke="#78350F" stroke-width="4"/>
    <line x1="-70" y1="-50" x2="70" y2="-30" stroke="#FFFBEB" stroke-width="3"/>
    <line x1="-70" y1="50" x2="70" y2="30" stroke="#FFFBEB" stroke-width="3"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#FFFBEB" stroke-width="3"/>
  </g>

  <!-- Title Badge -->
  <rect x="220" y="400" width="360" height="50" rx="12" fill="#B45309"/>
  <text x="400" y="433" font-family="'Yatra One', 'Noto Sans Devanagari', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ग्रामदैवत जत्रा उत्सव व संस्कृती</text>
</svg>
