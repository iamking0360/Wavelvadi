<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf497" />
      <stop offset="5%" stop-color="#fdf497" />
      <stop offset="45%" stop-color="#fd5949" />
      <stop offset="60%" stop-color="#d6249f" />
      <stop offset="90%" stop-color="#285AEB" />
    </linearGradient>
    <linearGradient id="igIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f58529" />
      <stop offset="50%" stop-color="#dd2a7b" />
      <stop offset="100%" stop-color="#8134af" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8134af" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="500" height="500" fill="#FFFFFF" rx="28"/>
  <rect x="12" y="12" width="476" height="476" fill="none" stroke="url(#igGradient)" stroke-width="6" rx="24"/>

  <!-- Top Instagram Badge -->
  <g transform="translate(160, 28)">
    <rect width="180" height="36" rx="18" fill="url(#igIconGrad)" />
    <text x="90" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">INSTAGRAM</text>
  </g>

  <!-- QR Matrix (Instagram styled) -->
  <g fill="#262626">
    <!-- Top-Left Finder -->
    <rect x="65" y="80" width="85" height="85" rx="18" fill="url(#igIconGrad)"/>
    <rect x="77" y="92" width="61" height="61" rx="12" fill="#FFFFFF"/>
    <rect x="89" y="104" width="37" height="37" rx="8" fill="url(#igIconGrad)"/>

    <!-- Top-Right Finder -->
    <rect x="350" y="80" width="85" height="85" rx="18" fill="url(#igIconGrad)"/>
    <rect x="362" y="92" width="61" height="61" rx="12" fill="#FFFFFF"/>
    <rect x="374" y="104" width="37" height="37" rx="8" fill="url(#igIconGrad)"/>

    <!-- Bottom-Left Finder -->
    <rect x="65" y="305" width="85" height="85" rx="18" fill="url(#igIconGrad)"/>
    <rect x="77" y="317" width="61" height="61" rx="12" fill="#FFFFFF"/>
    <rect x="89" y="329" width="37" height="37" rx="8" fill="url(#igIconGrad)"/>

    <!-- QR Data Elements -->
    <rect x="180" y="85" width="22" height="22" rx="4"/>
    <rect x="220" y="85" width="22" height="22" rx="4"/>
    <rect x="260" y="85" width="22" height="45" rx="4"/>
    <rect x="300" y="85" width="22" height="22" rx="4"/>

    <rect x="180" y="130" width="45" height="22" rx="4"/>
    <rect x="245" y="145" width="22" height="22" rx="4"/>
    <rect x="285" y="130" width="40" height="22" rx="4"/>

    <rect x="70" y="190" width="30" height="22" rx="4"/>
    <rect x="120" y="185" width="30" height="45" rx="4"/>
    <rect x="350" y="190" width="40" height="22" rx="4"/>
    <rect x="410" y="180" width="25" height="40" rx="4"/>

    <rect x="70" y="245" width="22" height="35" rx="4"/>
    <rect x="110" y="255" width="40" height="22" rx="4"/>
    <rect x="350" y="240" width="25" height="45" rx="4"/>
    <rect x="395" y="245" width="40" height="22" rx="4"/>

    <rect x="180" y="315" width="45" height="22" rx="4"/>
    <rect x="245" y="315" width="22" height="45" rx="4"/>
    <rect x="285" y="315" width="40" height="22" rx="4"/>
    <rect x="180" y="360" width="22" height="30" rx="4"/>
    <rect x="220" y="375" width="45" height="22" rx="4"/>
    <rect x="285" y="360" width="40" height="37" rx="4"/>
    <rect x="350" y="315" width="22" height="22" rx="4"/>
    <rect x="390" y="330" width="45" height="22" rx="4"/>
    <rect x="350" y="360" width="40" height="37" rx="4"/>
    <rect x="410" y="375" width="25" height="22" rx="4"/>
  </g>

  <!-- Center Instagram Camera Logo -->
  <g transform="translate(205, 195)" filter="url(#shadow)">
    <rect width="90" height="90" rx="22" fill="url(#igIconGrad)"/>
    <rect x="16" y="16" width="58" height="58" rx="16" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="45" cy="45" r="14" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="61" cy="29" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Instagram Handle Pill -->
  <g transform="translate(60, 420)">
    <rect width="380" height="50" rx="25" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="190" y="31" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">
      @wavelvadi_official
    </text>
  </g>
</svg>
